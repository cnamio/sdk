name: publish-pypi
# Publishes PyPI `cnamio` by trusted publishing (no token) on a tag v<version> or by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: build
        run: |
          python -m pip install --upgrade build
          python -m build python --outdir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
