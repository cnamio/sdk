name: publish
# Publishes npm `cnamio` (and later PyPI `cnamio`) when a tag v<version> is pushed.
# npm: trusted publishing (OIDC) configured on npmjs.com for cnamio/sdk + publish.yml; no token needed (npm >= 11.5.1).
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: npm with trusted publishing support
        run: npm install -g npm@11.21.2  # exact version (SEC-15): this job holds id-token: write
      - name: version matches tag
        run: test "v$(node -p "require('./npm/package.json').version")" = "${GITHUB_REF_NAME}"
      - name: publish
        working-directory: npm
        run: npm publish --access public
